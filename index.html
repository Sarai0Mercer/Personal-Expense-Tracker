<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Personal Expense Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header>
      <h1>Personal Expense Tracker</h1>
      <p>Track your income and expenses easily.</p>
    </header>

    <section class="summary">

      <div class="card">
        <h3>Total Income</h3>
        <p id="income">৳0.00</p>
      </div>

      <div class="card">
        <h3>Total Expense</h3>
        <p id="expense">৳0.00</p>
      </div>

      <div class="card">
        <h3>Balance</h3>
        <p id="balance">৳0.00</p>
      </div>

    </section>

    <section class="panel">

      <h2>Add Transaction</h2>

      <form id="transactionForm">

        <input
          type="text"
          id="description"
          placeholder="Description"
          required
        >

        <input
          type="number"
          id="amount"
          placeholder="Amount (BDT)"
          min="0"
          step="0.01"
          required
        >

        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Salary</option>
          <option>Other</option>
        </select>

        <button type="submit">Add Transaction</button>

      </form>

    </section>

    <section class="panel">

      <h2>Transactions</h2>

      <div id="emptyState">
        No transactions yet.
      </div>

      <ul id="transactionList"></ul>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
